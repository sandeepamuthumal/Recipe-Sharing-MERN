services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.prod
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    restart: always

  mongodb:
    image: mongo
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data: